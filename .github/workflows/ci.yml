name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows-lint:
    name: Workflows lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned + checksum-verified through the Go module proxy (sum.golang.org).
      # Catches the class of bug that silently killed release runs on 20 Aug 2026:
      # an invalid expression (${{ GITHUB_REF_NAME }}) makes GitHub reject the whole
      # workflow file, producing a zero-job "workflow file issue" failure.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: |
          ACTIONLINT="$(go env GOPATH)/bin/actionlint"
          "$ACTIONLINT" -color

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify all commits carry Signed-off-by (DCO)
        run: |
          set -e
          BASE="${GITHUB_EVENT_PULL_REQUEST_BASE_SHA:-${{ github.event.pull_request.base.sha }}}"
          HEAD="${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "Skipping DCO check outside pull_request context"
            exit 0
          fi
          bad=""
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by: "; then
              echo "::error::commit $c is missing Signed-off-by trailer (DCO)"
              bad=1
            fi
          done
          if [ -n "$bad" ]; then
            echo "All commits must include a Signed-off-by trailer. Use: git commit -s"
            exit 1
          fi
          echo "DCO check passed"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Run tests
        run: pytest
      - name: Verify CLI entry point
        run: ajson --help || python -m ajson --help

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run OSV-Scanner
        uses: google/osv-scanner/actions/scanner@v1
        with:
          scan-args: |-
            --recursive
            .
            --fail-on-vuln
