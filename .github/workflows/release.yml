name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to backfill (e.g. v0.1.0). Leave empty to use the pushed tag."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_backfill=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_backfill=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Manual dispatch requires the 'tag' input (ref is '$GITHUB_REF_NAME', not a release tag)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build distributable
        run: |
          if [ -f pyproject.toml ]; then
            python -m build --outdir dist/
          else
            mkdir -p dist
            tar czf dist/ajson-site.tar.gz --exclude=.git --exclude=dist ./
          fi

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for asset in dist/*; do
            cosign sign-blob --yes \
              --output-certificate "$asset.pem" \
              --output-signature "$asset.sig" \
              "$asset"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS
          cd ..
          sha256sum sbom.cdx.json >> SHA256SUMS

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          files: |
            dist/*
            dist/*.sig
            dist/*.pem
            sbom.cdx.json
            SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
